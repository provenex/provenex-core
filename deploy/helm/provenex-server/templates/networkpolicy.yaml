{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "provenex-server.fullname" . }}
  labels:
    {{- include "provenex-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "provenex-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # App pods labelled provenex-client are the only ones allowed to
    # reach the verify service. Operators can override by editing the
    # template; the default is deny-everyone-else.
    - from:
        - podSelector:
            matchLabels:
              provenex-client: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Postgres
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
