{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "provenex-server.fullname" . }}
  labels:
    {{- include "provenex-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "provenex-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # App pods labelled provenex-client are the only ones allowed to
    # reach the verify service. The default is deny-everyone-else.
    - from:
        - podSelector:
            matchLabels:
              provenex-client: "true"
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.networkPolicy.monitoringNamespace }}
    # Scrape access from a monitoring namespace (Prometheus / Grafana
    # Agent / OTel collector). Without this rule the deny-by-default
    # ingress blocks /metrics scraping, even though the pod is
    # annotated with prometheus.io/scrape=true.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.postgresql.enabled }}
    # Bundled Postgres subchart pods (same namespace).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- range .Values.networkPolicy.databaseEgressCIDRs }}
    # External database egress (managed Postgres, PgBouncer, etc.).
    # Configure via networkPolicy.databaseEgressCIDRs in values.yaml.
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.databaseEgressPort | default 5432 }}
    {{- end }}
    # DNS (cluster + external resolvers).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
