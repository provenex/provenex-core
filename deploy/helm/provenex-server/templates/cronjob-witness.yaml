{{/*
NOTE: the witness-publisher CLI subcommand referenced below
(`provenex witness publish`) is not yet implemented as of this
release. Enabling this CronJob will run a container that exits with
"command not found" on every fire. The template is checked in as a
placeholder for the v1.0 witness rollout; until then, leave
witness.enabled=false. See docs/runbooks/witness_log.md for the
manual / library API path.
*/}}
{{- if .Values.witness.enabled -}}
{{- fail "witness.enabled=true: the `provenex witness publish` CLI subcommand is not implemented in this release. Use the WitnessLog library API directly (see docs/runbooks/witness_log.md) or wait for the v1.0 witness rollout." -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "provenex-server.fullname" . }}-witness
  labels:
    {{- include "provenex-server.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.witness.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: witness
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["provenex"]
              args: ["witness", "publish"]
              env:
                {{- include "provenex-server.envFromSecrets" . | nindent 16 }}
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
{{- end }}
