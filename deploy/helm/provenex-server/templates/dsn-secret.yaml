{{- if and .Values.postgresql.enabled (not .Values.externalDsnSecret) -}}
{{/*
Synthesizes a DSN Secret pointing at the bundled Postgres subchart. The
subchart creates its own credential Secret; we just stitch the DSN out
of the values into a place the verify pods can mount uniformly. Used
only when postgresql.enabled is true; in production you provide
externalDsnSecret pointing at a Secret with key 'dsn'.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "provenex-server.fullname" . }}-bundled-dsn
  labels:
    {{- include "provenex-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
{{- end }}
