# Provenex policy operator: Deployment + RBAC.
#
# Apply this after the CRD (deploy/operator/crd.yaml). The operator
# watches Policy CRs cluster-wide and reconciles each into its named
# ConfigMap. RBAC is intentionally narrow: read Policy, read+write
# ConfigMaps, no Secret access.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provenex-operator
  namespace: provenex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provenex-operator
rules:
  - apiGroups: [provenex.io]
    resources: [policies, policies/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provenex-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provenex-operator
subjects:
  - kind: ServiceAccount
    name: provenex-operator
    namespace: provenex-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provenex-operator
  namespace: provenex-system
  labels:
    app.kubernetes.io/name: provenex-operator
spec:
  replicas: 1  # operator should run as single-writer; HA via leader election is future work
  selector:
    matchLabels:
      app.kubernetes.io/name: provenex-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provenex-operator
    spec:
      serviceAccountName: provenex-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: operator
          image: provenex/provenex-operator:1.1.0
          imagePullPolicy: IfNotPresent
          command: ["kopf"]
          args:
            - run
            - -m
            - provenex.operator.main
            - --standalone
            - --verbose
            # Bind kopf's built-in HTTP healthcheck so kubelet can probe
            # liveness. Without this, a hung kopf reconcile loop is
            # invisible to the cluster and the operator keeps running
            # without making progress. Port 9696 is kopf's documented
            # default for --liveness.
            - --liveness=http://0.0.0.0:9696/healthz
          ports:
            - name: probe
              containerPort: 9696
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          # kopf does not distinguish liveness from readiness; reuse the
          # same endpoint. A reconcile loop that has not yet caught up
          # still reports ready, which matches the cluster's expectation
          # for a controller-style workload.
          readinessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
