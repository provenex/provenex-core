name: release

# Builds, SBOMs, signs, and publishes a release.
#
# Triggers:
#   * push of a `v*` tag — full release flow: build, SBOM, GitHub Release,
#     PyPI publish (Sigstore-signed attestations via PEP 740).
#   * manual workflow_dispatch — build + SBOM only, useful for verifying
#     the pipeline ahead of a tag.
#
# PyPI publishing uses a trusted publisher (OIDC). No long-lived API token
# is stored in repository secrets. The publisher binding is configured on
# PyPI under the project's "Manage" → "Publishing" page; it must reference
# this workflow file (release.yml) and the `pypi` environment below.
#
# Sigstore signing of the wheel / sdist is performed by
# `pypa/gh-action-pypi-publish` when `attestations: true` is set. The
# signed attestations are recorded on the PyPI release page and downstream
# consumers can verify them with `python -m sigstore verify` or the
# `pip install --require-hashes` machinery once it lands PEP 740 support.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build cyclonedx-bom

      # The deployment-critical extras (postgres, ed25519, policy) carry
      # the transitive dependencies that matter for compliance review.
      # Framework extras (langchain, langgraph, llamaindex, crewai) are
      # caller-driven and their bills of material belong to the caller.
      - name: Install package with deployment extras (for SBOM scope)
        run: pip install -e ".[postgres,ed25519,policy]"

      - name: Build sdist + wheel
        run: python -m build

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment -o dist/sbom.cdx.json
          echo "--- sbom summary ---"
          python -c "import json; d=json.load(open('dist/sbom.cdx.json')); print('components:', len(d.get('components', []))); print('spec:', d.get('bomFormat'), d.get('specVersion'))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI + sign via Sigstore
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/provenex-core
    permissions:
      id-token: write   # OIDC for PyPI trusted publisher + Sigstore
      contents: write   # attach SBOM to the GitHub release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Split the SBOM out of dist/ so it does not get uploaded to PyPI
      # alongside the sdist + wheel.
      - name: Stage SBOM outside dist/
        run: |
          mkdir -p release-extras
          mv dist/sbom.cdx.json release-extras/sbom.cdx.json

      - name: Publish to PyPI (trusted publisher + Sigstore attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Sigstore-sign sdist + wheel as PEP 740 attestations. Visible
          # on the PyPI release page; verifiable with `sigstore verify`.
          attestations: true

      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-extras/sbom.cdx.json
          fail_on_unmatched_files: true

  docker:
    name: Build + push Docker image to GHCR + sign with Sigstore
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/...
      id-token: write   # OIDC for cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip leading `v` from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Lowercase repo owner: GHCR requires the owner segment in
      # lowercase, but github.repository_owner can be mixed case.
      - name: Lowercase the GHCR image namespace
        id: ns
        run: |
          ns="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${ns}" >> "$GITHUB_OUTPUT"

      - name: Compute image labels + tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.ns.outputs.owner }}/provenex-server
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build + push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image SBOM is distinct from the Python-package SBOM the
          # `build` job emits: this one covers the OS layer (base image
          # packages) as well as the installed Python wheels.
          sbom: true
          # `provenance: mode=max` emits SLSA build provenance attached
          # to the manifest, signed by buildx with the GitHub Actions
          # OIDC identity. Verifiable via `cosign verify-attestation`.
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: cosign mints a short-lived certificate from
      # Sigstore Fulcio using the GitHub Actions OIDC token, signs the
      # image digest, and writes the signature to the registry alongside
      # the image. No long-lived key.
      - name: Sign the image (Sigstore keyless via OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.ns.outputs.owner }}/provenex-server
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST}"
          echo "Verify with: cosign verify ${IMAGE}:${{ steps.ver.outputs.version }} \\"
          echo "  --certificate-identity 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}' \\"
          echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'"
