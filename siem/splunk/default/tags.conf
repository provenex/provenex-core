## Provenex Splunk app -- tags.conf
##
## CIM datamodel tagging. Splunk's CIM datamodels require events to be
## tagged with the right keywords so the model's constraints match.
## Provenex receipts naturally fit the Audit Activity model (every
## receipt is an audit record of a decision); deny/block events also
## fit Authentication (action=blocked, user=caller_hash) and Web
## (app=policy_id) for the SOC dashboards that pivot on those models.

[eventtype=provenex_receipt]
audit = enabled
report = enabled
provenex = enabled

[eventtype=provenex_blocked]
audit = enabled
authentication = enabled
provenex = enabled

[eventtype=provenex_drift]
audit = enabled
alert = enabled
provenex = enabled
