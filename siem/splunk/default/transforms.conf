## Provenex Splunk app -- transforms.conf
##
## Regex-based extractors referenced from props.conf via REPORT-* directives.
## EVAL-* and FIELDALIAS-* live in props.conf (the per-sourcetype stanza)
## because they are Splunk-side computations, not REGEX extractions.
##
## The receipt field paths reflect schema 2.6.0 (provenex-core 1.0.0+).

## Pull the issuer version off the receipt and surface it as
## product_version so the CIM ``Vendor Product`` datamodel
## reports the right SDK release that produced the event.
[provenex_receipt_product_version]
SOURCE_KEY = _raw
REGEX = "issuer"\s*:\s*"provenex-core/(?P<product_version>[0-9][0-9.]*)"

## Canonical event UID for the CIM ``Audit`` datamodel: signature_id
## is the conventional name for a per-event correlation key.
[provenex_receipt_signature_id_alias]
SOURCE_KEY = _raw
REGEX = "receipt_id"\s*:\s*"(?P<signature_id>prx_[a-f0-9]+)"

## Access-control policy identifier surfaces as the CIM ``app`` field
## so existing Web / Authentication CIM dashboards group correctly.
[provenex_receipt_app]
SOURCE_KEY = _raw
REGEX = "policy_id"\s*:\s*"(?P<app>[^"]+)"
