[provenex:receipt]
KV_MODE = json
TRUNCATE = 0
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
TIME_PREFIX = "issued_at":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
disabled = false

# CIM-friendly field aliases. Splunk's CIM model lets dashboards stay
# transport-neutral so existing SOC workflows recognize Provenex events
# without bespoke per-receipt knowledge.
FIELDALIAS-provenex_user_id = caller_hash AS user_id
FIELDALIAS-provenex_user = caller_hash AS user
FIELDALIAS-provenex_sig_id = receipt_id AS signature_id

# REPORT extractors defined in transforms.conf.
REPORT-provenex_product_version = provenex_receipt_product_version
REPORT-provenex_signature_id = provenex_receipt_signature_id_alias
REPORT-provenex_app = provenex_receipt_app

# v1.0.0: derive a CIM ``action`` from the receipt's operating mode +
# overall status. In receipts_only the engine passes everything through
# even when the policy would block; ``overall_status`` alone overcounts
# "allowed" without this caveat.
EVAL-action = case( \
    'policy.mode'=="receipts_only","logged", \
    'policy.mode'=="advisory","advisory", \
    'summary.overall_status'=="FAIL","blocked", \
    'summary.overall_status'=="PASS","allowed", \
    'summary.overall_status'=="PARTIAL","allowed", \
    true(),"unknown")

# CIM severity from outcome counts. TAMPERED is the alarm condition.
EVAL-severity = case( \
    'summary.tampered'>0,"critical", \
    'summary.unauthorized'>0,"high", \
    'summary.unverified'>0,"medium", \
    true(),"low")

EVAL-severity_id = case( \
    'summary.tampered'>0,5, \
    'summary.unauthorized'>0,4, \
    'summary.unverified'>0,3, \
    true(),2)

# Static vendor/product identifiers for the CIM ``Vendor Product`` model.
EVAL-vendor = "provenex"
EVAL-product = "provenex-core"

[provenex:drift]
KV_MODE = json
TRUNCATE = 0
SHOULD_LINEMERGE = false
TIME_PREFIX = "last_seen_ts":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
disabled = false

# Drift event severity scales with the unique fingerprint count seen
# inside the detector's window.
EVAL-severity = case( \
    'distinct_fingerprints'>50,"high", \
    'distinct_fingerprints'>10,"medium", \
    true(),"low")
