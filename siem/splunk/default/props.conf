[provenex:receipt]
KV_MODE = json
TRUNCATE = 0
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
TIME_PREFIX = "issued_at":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 30
disabled = false

# CIM-friendly field aliases. Splunk's CIM model lets dashboards stay
# transport-neutral so existing SOC workflows recognize Provenex events
# without bespoke per-receipt knowledge.
FIELDALIAS-provenex_user = caller_hash AS user_id
FIELDALIAS-provenex_sig = receipt_id AS signature_id

[provenex:drift]
KV_MODE = json
TRUNCATE = 0
SHOULD_LINEMERGE = false
TIME_PREFIX = "last_seen_ts":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
disabled = false
