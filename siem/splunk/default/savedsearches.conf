[provenex_denied_tool_calls_24h]
# Receipts where any action was denied by the tool-call admission
# policy in the last 24h, grouped by caller. The decision lives at
# policy.tool_call_control.decisions[].decision indexed by
# action_index, parallel to the actions[] array; a per-action
# breakdown therefore requires zipping the two arrays by index
# (left as a follow-up; see the Sentinel KQL in this repo for the
# joined version). The search below surfaces the caller-level
# count, which is the SOC-actionable signal.
search = sourcetype=provenex:receipt "policy.tool_call_control.decisions{}.decision"=deny \
    | stats count by caller_hash \
    | sort -count
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
description = Tool calls denied by Provenex admission in the last 24h, grouped by caller_hash.
is_visible = true

[provenex_unverified_chunks_by_jurisdiction]
# Jurisdiction is at policy.access_control.decisions[].inputs.request_context.jurisdiction
# (schema 2.6.0). request_binding holds only hashes, not the
# verbatim request_context, so jurisdiction must come from the
# per-decision inputs subtree.
search = sourcetype=provenex:receipt sources{}.verification_outcome=UNVERIFIED \
    | rename "policy.access_control.decisions{}.inputs.request_context.jurisdiction" AS jurisdiction \
    | eval jurisdiction = if(isnotnull(jurisdiction), mvindex(jurisdiction, 0), "unknown") \
    | stats count by jurisdiction \
    | sort -count
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
description = UNVERIFIED chunks in the last 24h, grouped by request jurisdiction. Spikes in one jurisdiction usually signal an ingest gap for that corpus.
is_visible = true

[provenex_drift_alerts]
search = sourcetype=provenex:drift type=provenex.index_drift \
    | stats count, values(distinct_fingerprints{}) AS sample_fingerprints, \
            max(window_seconds) AS window \
            by host \
    | sort -count
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
description = Drift detector alerts from the Provenex IndexDriftDetector webhook. Distinct UNVERIFIED fingerprints coalesced inside the configured window.
is_visible = true
