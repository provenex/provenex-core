[provenex_denied_tool_calls_24h]
# Receipts where any action was denied by the tool-call admission
# policy in the last 24h, grouped by caller. The decision lives at
# policy.tool_call_control.decisions[].decision indexed by
# action_index, parallel to the actions[] array; a per-action
# breakdown therefore requires zipping the two arrays by index
# (left as a follow-up; see the Sentinel KQL in this repo for the
# joined version). The search below surfaces the caller-level
# count, which is the SOC-actionable signal.
search = sourcetype=provenex:receipt "policy.tool_call_control.decisions{}.decision"=deny \
    | stats count by caller_hash \
    | sort -count
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
description = Tool calls denied by Provenex admission in the last 24h, grouped by caller_hash.
is_visible = true

[provenex_unverified_chunks_by_jurisdiction]
# Jurisdiction is at policy.access_control.decisions[].inputs.request_context.jurisdiction
# (schema 2.6.0). request_binding holds only hashes, not the
# verbatim request_context, so jurisdiction must come from the
# per-decision inputs subtree.
search = sourcetype=provenex:receipt sources{}.verification_outcome=UNVERIFIED \
    | rename "policy.access_control.decisions{}.inputs.request_context.jurisdiction" AS jurisdiction \
    | eval jurisdiction = if(isnotnull(jurisdiction), mvindex(jurisdiction, 0), "unknown") \
    | stats count by jurisdiction \
    | sort -count
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
description = UNVERIFIED chunks in the last 24h, grouped by request jurisdiction. Spikes in one jurisdiction usually signal an ingest gap for that corpus.
is_visible = true

[provenex_drift_alerts]
search = sourcetype=provenex:drift type=provenex.index_drift \
    | stats count, values(distinct_fingerprints{}) AS sample_fingerprints, \
            max(window_seconds) AS window \
            by host \
    | sort -count
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
description = Drift detector alerts from the Provenex IndexDriftDetector webhook. Distinct UNVERIFIED fingerprints coalesced inside the configured window.
is_visible = true

[provenex_tampered_alarms]
# TAMPERED is the alarm condition: a row's HMAC signature did not
# verify against its canonical payload. Either the index storage was
# directly modified, or the index secret was rotated without the
# matching key on the verify side. Pages SHOULD fire on this.
search = sourcetype=provenex:receipt sources{}.verification_outcome=TAMPERED \
    | stats count, dc(receipt_id) AS receipts, values(caller_hash) AS callers by host \
    | sort -count
dispatch.earliest_time = -1h@h
dispatch.latest_time = now
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 15m
alert.track = 1
description = TAMPERED outcomes from Provenex verification. Critical: signing key may be compromised OR the index storage was directly modified.
is_visible = true

[provenex_receipts_by_mode_24h]
# v1.0.0+: each receipt records the operating mode in policy.mode.
# Fleet-wide posture audit: how many receipts were enforced vs
# advisory vs receipts_only? A SOC that sees lots of receipts_only
# events when production should be on enforce has a real problem.
search = sourcetype=provenex:receipt \
    | eval mode = if(isnotnull('policy.mode'), 'policy.mode', "pre-1.0.0") \
    | stats count by mode \
    | sort -count
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
description = Receipts in the last 24h grouped by policy.mode (v1.0.0+). Spot fleet members still in receipts_only when they should be in enforce.
is_visible = true

[provenex_top_callers_by_denial_rate_24h]
# Per-caller deny rate. The SOC pattern: a caller whose deny rate
# spikes above the baseline is either misconfigured (calling the
# wrong tool / requesting out-of-jurisdiction data) or compromised
# (probing the policy). Either way, worth investigating.
search = sourcetype=provenex:receipt \
    | eval denied = if('summary.overall_status'=="FAIL", 1, 0) \
    | stats sum(denied) AS denied_count, count AS total by caller_hash \
    | where total >= 10 \
    | eval deny_rate = round(denied_count / total, 3) \
    | sort -deny_rate \
    | head 20
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
description = Top callers by Provenex deny rate (24h, minimum 10 receipts). The leaderboard for "who is the policy stopping the most?".
is_visible = true

[provenex_advisory_would_have_blocked_24h]
# v1.0.0+: in advisory mode the data path is open but the policy
# decision is still on the receipt. The right rollout sequence is
# receipts_only -> advisory (watch this search) -> enforce. When
# this stops firing for a corpus, that corpus is ready for enforce.
search = sourcetype=provenex:receipt "policy.mode"=advisory ("summary.overall_status"=FAIL OR "policy.tool_call_control.decisions{}.decision"=deny) \
    | rename "policy.access_control.policy_id" AS policy_id \
    | eval policy_id = if(isnotnull(policy_id), mvindex(policy_id, 0), "(none)") \
    | stats count by policy_id, caller_hash \
    | sort -count
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
description = Advisory-mode receipts that would have blocked something in enforce. Use this during a controlled rollout from receipts_only -> advisory -> enforce.
is_visible = true
