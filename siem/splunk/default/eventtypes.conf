## Provenex Splunk app -- eventtypes.conf
##
## Named event groupings the CIM datamodel tagging in tags.conf binds
## against. Each eventtype is a search expression; matching events
## inherit the configured tags.

[provenex_receipt]
search = sourcetype=provenex:receipt
description = Any Provenex provenance receipt.

[provenex_blocked]
search = sourcetype=provenex:receipt summary.overall_status=FAIL
description = Provenex receipts whose policy blocked at least one chunk or denied at least one action.

[provenex_drift]
search = sourcetype=provenex:drift
description = Provenex drift detector webhook events (coalesced UNVERIFIED fingerprints).
