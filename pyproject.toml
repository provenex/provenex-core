[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenex-core"
version = "1.1.0"
description = "Policy enforcement for AI data access, with cryptographic proof"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Provenex" }]
keywords = ["rag", "provenance", "ai", "policy", "security", "compliance", "fingerprinting", "langchain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# v1.0.0: the only runtime dependency is `cryptography`, used for
# Ed25519 (the default signer) and for KMS/HSM adapters. The "zero-
# dependency stdlib core" framing of 0.x is gone now that Ed25519 is
# the default -- third-party-verifiable receipts are worth one well-
# audited dependency. HMAC remains stdlib-only and is still selectable
# explicitly for tightly-coupled deployments.
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<0.4"]
llamaindex = ["llama-index-core>=0.10,<0.13"]
# LangGraph users get trajectory-aware retrieval nodes plus state helpers.
# The integration itself imports nothing from langgraph (LangGraph nodes
# are just callables); this extra exists for discoverability.
langgraph = ["langgraph>=0.2,<0.3"]
# CrewAI users get a session-scoped trajectory + a tool wrapper that emits
# trajectory-linked receipts on every tool call. As with langgraph, the
# integration imports nothing from crewai — this extra is for discovery.
crewai = ["crewai>=0.55"]
# v1.0.0: no-op alias for backwards compatibility with the 0.x
# ``pip install "provenex-core[ed25519]"`` pattern. The cryptography
# library is now in the base ``dependencies`` because Ed25519 is the
# default signer.
ed25519 = []
# Native YAML data-access policy DSL (schema 1.5.0). The evaluator imports
# PyYAML lazily and raises a clear error if this extra is missing, so the
# core remains pure-stdlib for users who don't author policies in YAML.
policy = ["PyYAML>=6.0"]
# Postgres-backed provenance index for multi-node / production deployments.
# Imports psycopg lazily; the SQLite backend (and the core) remain pure
# stdlib without this extra.
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
# HTTP server (provenex-server). Thin FastAPI wrapper for Pattern B
# (sidecar) and Pattern C (centralized verify service) deployments.
# Pulls in the postgres extra by reference plus the ASGI stack.
server = [
    "provenex-core[postgres]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]
# Lightweight Kubernetes operator that reconciles Policy CRs into the
# ConfigMap the verify pods read. Off the hot path; ships as a separate
# image and is independent of the server.
operator = [
    "kopf>=1.37",
    "kubernetes>=29.0",
    "PyYAML>=6.0",
]
# KMS / HSM signer adapters. Each adapter implements the same
# ReceiptSigner protocol the OSS HmacSha256Signer / Ed25519Signer do,
# so the signing key never has to leave the KMS / HSM. The cryptography
# dep is pulled in transitively for the verify() path.
kms-aws = ["boto3>=1.34", "cryptography>=42.0"]
kms-gcp = ["google-cloud-kms>=2.21", "cryptography>=42.0"]
kms-azure = [
    "azure-identity>=1.15",
    "azure-keyvault-keys>=4.9",
    "cryptography>=42.0",
]
pkcs11 = ["python-pkcs11>=0.7", "cryptography>=42.0"]
# Identity-provider recipes that build a RequestContext from a JWT.
# PyJWT does signature verification; cryptography is its asymmetric
# backend.
identity = ["PyJWT[crypto]>=2.8", "cryptography>=42.0"]
# Streaming export sinks (0.6.6+). The core sinks (StdoutJSONLSink,
# FileJSONLSink, MultiSink, RetryQueueSink) ship in the stdlib core;
# these extras add the network-bound sinks.
export-kafka = ["kafka-python>=2.0"]
export-aws = ["boto3>=1.34"]
export-gcp = ["google-cloud-pubsub>=2.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "cryptography>=42.0",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    # ASGI deps for the Phase 1.2 100-concurrent-verify acceptance test.
    "starlette>=0.37",
    "httpx>=0.27",
    # Bench harness optionally measures standalone-verifier latency. When
    # the verifier is installed the bench captures the verifier_verification
    # block; CI installs it so the block is exercised, not skipped.
    "provenex-verifier>=1.0.0",
]

[project.scripts]
provenex = "provenex.cli.main:main"

[project.urls]
Homepage = "https://provenex.ai"
Repository = "https://github.com/provenex/provenex-core"
Documentation = "https://provenex.ai/docs"

[tool.setuptools.packages.find]
include = ["provenex*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by black

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Silence Provenex's own design-time deprecation nudges during test
# runs. These warnings exist to push callers toward strict defaults
# before a future major flips them; many tests exercise the lax path
# on purpose to verify the warning fires, and updating all of them
# to opt in explicitly is busywork.
#
# The filter format is action:message:category:module:lineno where
# message is a re.match regex. The Provenex warning texts contain
# colons, which would confuse the colon-separated filter syntax, so
# we match on the unambiguous prefix before the first colon. The
# last entry restores the "show each unknown deprecation once" default
# so third-party deprecations still surface.
filterwarnings = [
    "ignore:VerificationPolicy:DeprecationWarning",
    "ignore:compute_caller_hash called without a salt:DeprecationWarning",
    "ignore:Provenex index secret resolved via legacy:DeprecationWarning",
    "ignore:Provenex receipt secret resolved via legacy:DeprecationWarning",
]

[tool.coverage.run]
source = ["provenex"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
